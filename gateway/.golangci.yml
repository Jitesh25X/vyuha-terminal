# golangci-lint v2 (pinned in scripts/bootstrap.sh). Generated code (oapi-codegen, sqlc, buf) is excluded.
version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - misspell
    - unconvert
  exclusions:
    generated: strict
    paths:
      - gen/
      - internal/api/api.gen.go
      - internal/store/.*\.sql\.go
      - internal/store/(db|models)\.go
    rules:
      # Test code deliberately builds SQL from ids and ignores cleanup errors.
      - path: _test\.go
        linters: [gosec, errcheck, noctx]
formatters:
  enable:
    - gofmt
