openapi: 3.0.3
info:
  title: Vyuha Gateway API
  version: 0.0.1
  description: |
    REST contract for the Vyuha gateway (source of truth for codegen; see docs/API.md).
    Endpoints are added contract-first by the task that implements them.
    Money/prices are decimal strings; timestamps are RFC 3339 UTC; errors are RFC 9457 problem+json.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: brokers
  - name: marketdata
paths:
  /health:
    get:
      operationId: getHealth
      summary: Gateway health with dependency checks
      description: Unauthenticated. 200 when every check passes, 503 when any dependency is unavailable.
      tags: [system]
      security: []
      responses:
        "200":
          description: All checks pass
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: At least one dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/login:
    post:
      operationId: login
      summary: Password step; returns an mfa_token for the TOTP step
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Password accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423": { $ref: "#/components/responses/Locked" }
  /auth/mfa:
    post:
      operationId: verifyMfa
      summary: TOTP step for an enrolled user; starts a session
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaRequest" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423": { $ref: "#/components/responses/Locked" }
  /auth/mfa/enroll:
    post:
      operationId: beginMfaEnroll
      summary: First login only; generates a TOTP secret to scan
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaTokenRequest" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Secret generated (not active until confirmed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423": { $ref: "#/components/responses/Locked" }
  /auth/mfa/enroll/confirm:
    post:
      operationId: confirmMfaEnroll
      summary: Confirms enrollment with a first code and starts a session
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaRequest" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423": { $ref: "#/components/responses/Locked" }
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotates the refresh cookie and returns a new access token
      description: Presenting an already-rotated refresh token revokes the whole session (AUTH_REFRESH_REUSED).
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401":
          description: Missing, invalid, expired or reused refresh token; the cookie is cleared
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/logout:
    post:
      operationId: logout
      summary: Revokes the current session and clears the refresh cookie
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "204":
          description: Logged out
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
  /auth/reauth:
    post:
      operationId: reauth
      summary: Re-checks password + TOTP; returns a reauth_token for the X-Reauth header
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Re-authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423": { $ref: "#/components/responses/Locked" }
  /brokers/{account_id}/login-url:
    get:
      operationId: getBrokerLoginUrl
      summary: Daily broker login URL (Kite Connect login / Upstox OAuth dialog)
      description: |
        Admin, or a trader mapped to the account with can_trade. The URL carries a signed, single-use
        `state` (10 minutes) that the callback checks; the broker's own 2FA happens on its site.
      tags: [brokers]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Login URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerLoginUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The account has no broker login (BROKER_NO_LOGIN, e.g. a sim account)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /brokers/callback/zerodha:
    get:
      operationId: brokerCallbackZerodha
      summary: Kite Connect redirect; exchanges request_token and starts the engine session
      description: |
        Browser redirect from Kite (no bearer token: the signed `state` identifies the user). Always
        redirects to `/terminal?broker_login=ok&account=<id>` or `/terminal?broker_login=error&code=<CODE>`.
      tags: [brokers]
      security: []
      parameters:
        - { name: request_token, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        "302": { $ref: "#/components/responses/BrokerLoginRedirect" }
  /brokers/callback/upstox:
    get:
      operationId: brokerCallbackUpstox
      summary: Upstox OAuth redirect; exchanges the code and starts the engine session
      description: Same contract as the Kite callback.
      tags: [brokers]
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        "302": { $ref: "#/components/responses/BrokerLoginRedirect" }
  /instruments/search:
    get:
      operationId: searchInstruments
      summary: Active instruments whose trading symbol or underlying symbol starts with q
      tags: [marketdata]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 40 } }
        - name: segment
          in: query
          required: false
          description: Segment (EQ, FUT, OPT, IDX) or exchange (NSE, BSE, NFO, BFO)
          schema: { type: string, enum: [EQ, FUT, OPT, IDX, NSE, BSE, NFO, BFO] }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Matches, exact symbol first, then cash/index before derivatives
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Instrument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /instruments/{id}:
    get:
      operationId: getInstrument
      summary: One instrument (active or expired)
      tags: [marketdata]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: Instrument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /instruments/{id}/expiries:
    get:
      operationId: getExpiries
      summary: Active option expiries of an underlying (today IST onwards), nearest first
      tags: [marketdata]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: Expiry dates (empty when the instrument has no listed options)
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: date }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /indices/{id}/constituents:
    get:
      operationId: getIndexConstituents
      summary: Members of an index with weight and sector (reference data for MOV and HM)
      description: |
        Reference data only (no prices): the terminal streams live quotes for the returned ids over the
        WebSocket and ranks/colours them itself. Baselines for volume shockers (`avg_volume_20d`) and OI
        gainers (`future_id` + `future_prev_oi`) are optional. Until the graph seed lands (M6.1) no source
        is configured and every index answers 404 NO_CONSTITUENTS.
      tags: [marketdata]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: Constituents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexConstituents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /optionchain/{underlying_id}:
    get:
      operationId: getOptionChain
      summary: Option chain with IV, Greeks, PCR and max pain (F-MD-3)
      description: |
        Rows: strikes ± `strikes` around ATM (nearest strike to the underlying's LTP; the middle listed
        strike before any price is known) for one expiry (default: nearest). Market fields come from the
        latest tick of a feed the user may see (ADR-020); contracts with none are listed without them.
        PCR and max pain cover every strike of the expiry with OI (`oi_strikes`), independent of the
        rows. The gateway does not register engine interest: the terminal subscribes `contract_ids`
        (the whole expiry) and the underlying/future over the WebSocket. IV/Greeks are computed by
        quant (RISK_ENGINE §6.1: Black-76 on the same-expiry future or the put-call-parity forward for
        index options, BSM on spot for stock options) from the mid when the spread is tight, else from
        an LTP that traded within the last minute (`iv_source`), else not at all. When quant is
        unreachable the chain is still returned with `analytics: unavailable`. `oi_chg` is OI minus the
        last recorded OI before today's session (ClickHouse 1-minute bars); absent without one. 403
        MD_NOT_ENTITLED when the user has no data-entitled account whose broker streams the chain.
      tags: [marketdata]
      parameters:
        - { name: underlying_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: expiry, in: query, required: false, schema: { type: string, format: date } }
        - { name: strikes, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Chain, strikes ascending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionChain" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /marketdata/candles:
    get:
      operationId: getCandles
      summary: Historical bars from ClickHouse (entitled instruments only)
      description: |
        Built from recorded 1-minute bars; 5m/15m/1h buckets in UTC, 1d buckets by IST trading day.
        At most 50,000 bars per call (400 BAD_REQUEST beyond). 403 MD_NOT_ENTITLED when the user has no
        data-entitled account whose broker streams the instrument (ADR-009).
      tags: [marketdata]
      parameters:
        - { name: instrument_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: interval, in: query, required: true, schema: { type: string, enum: ["1m", "5m", "15m", "1h", "1d"] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Bars, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candles" }
        "400":
          description: Bad range or too many bars (BAD_REQUEST)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Market data store unavailable (MD_UNAVAILABLE)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  parameters:
    RefreshCookie:
      name: vyuha_rt
      in: cookie
      required: false
      schema: { type: string }
  headers:
    SetCookie:
      description: "vyuha_rt refresh cookie (HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth)"
      schema: { type: string }
  responses:
    BrokerLoginRedirect:
      description: Back to the terminal with the outcome (never carries tokens)
      headers:
        Location:
          schema: { type: string }
    Forbidden:
      description: Not allowed for this user or account (FORBIDDEN)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource (NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    SessionStarted:
      description: Session started or refreshed; sets the rotated refresh cookie
      headers:
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SessionResponse" }
    Unauthorized:
      description: Invalid credentials or token (AUTH_INVALID, AUTH_UNAUTHENTICATED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Locked:
      description: Account locked after repeated failures (AUTH_LOCKED, see locked_until)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited (RATE_LIMITED) or too many credential checks in progress (AUTH_BUSY); retry after Retry-After seconds
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Wrong enrollment state (AUTH_MFA_NOT_ENROLLED, AUTH_MFA_ALREADY_ENROLLED, AUTH_MFA_ENROLL_NOT_STARTED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, version, env, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          example: 0.0.1
        env:
          type: string
          enum: [dev, staging, prod]
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Check" }
    Check:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail]
        latency_ms:
          type: integer
          format: int64
        error:
          type: string
          description: Generic reason; never contains hosts, credentials or driver errors.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 512, format: password }
    LoginResponse:
      type: object
      required: [mfa_token, mfa_enrolled]
      properties:
        mfa_token: { type: string, description: "Valid for 5 minutes" }
        mfa_enrolled: { type: boolean }
    MfaTokenRequest:
      type: object
      required: [mfa_token]
      properties:
        mfa_token: { type: string }
    MfaRequest:
      type: object
      required: [mfa_token, totp]
      properties:
        mfa_token: { type: string }
        totp: { type: string, pattern: "^[0-9]{6}$" }
    MfaEnrollResponse:
      type: object
      required: [otpauth_url, qr_png_base64]
      properties:
        otpauth_url: { type: string }
        qr_png_base64: { type: string }
    SessionResponse:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token: { type: string }
        expires_in: { type: integer, description: "Seconds" }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, username, display_name, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role:
          type: string
          enum: [admin, risk_manager, trader, analyst]
    ReauthRequest:
      type: object
      required: [password, totp]
      properties:
        password: { type: string, maxLength: 512, format: password }
        totp: { type: string, pattern: "^[0-9]{6}$" }
    ReauthResponse:
      type: object
      required: [reauth_token, expires_in]
      properties:
        reauth_token: { type: string }
        expires_in: { type: integer, description: "Seconds" }
    Instrument:
      type: object
      required: [id, exchange, segment, tradingsymbol, symbol, lot_size, tick_size, fo_ban]
      properties:
        id: { type: integer, format: int64 }
        exchange: { type: string, enum: [NSE, BSE, NFO, BFO] }
        segment: { type: string, enum: [EQ, FUT, OPT, IDX] }
        tradingsymbol: { type: string }
        symbol: { type: string }
        name: { type: string }
        expiry: { type: string, format: date }
        strike: { type: string, description: "Decimal string" }
        option_type: { type: string, enum: [CE, PE] }
        lot_size: { type: integer }
        tick_size: { type: string, description: "Decimal string" }
        freeze_qty: { type: integer }
        fo_ban: { type: boolean }
        underlying_id: { type: integer, format: int64 }
        valid_to: { type: string, format: date, description: "Set when the contract is no longer listed" }
    Candles:
      type: object
      required: [bars]
      properties:
        bars:
          type: array
          description: "[ts (RFC 3339 UTC, bar open), open, high, low, close (decimal strings), volume, oi]"
          items:
            type: array
            items: {}
    IndexConstituents:
      type: object
      required: [index_id, as_of, constituents]
      properties:
        index_id: { type: integer, format: int64 }
        as_of: { type: string, format: date, description: "Date of the constituent list / weights" }
        constituents:
          type: array
          items: { $ref: "#/components/schemas/Constituent" }
    Constituent:
      type: object
      required: [instrument_id, tradingsymbol]
      properties:
        instrument_id: { type: integer, format: int64 }
        tradingsymbol: { type: string }
        name: { type: string }
        sector: { type: string }
        weight: { type: number, format: double, description: "Index weight, percent" }
        avg_volume_20d: { type: integer, format: int64, description: "Average daily volume over the last 20 sessions" }
        future_id: { type: integer, format: int64, description: "Near-month stock future (OI gainers)" }
        future_prev_oi: { type: integer, format: int64, description: "That future's OI at the previous session's close" }
    OptionChain:
      type: object
      required: [underlying, expiry, lot_size, analytics, as_of, rows, contract_ids]
      properties:
        underlying:
          type: object
          required: [instrument_id]
          properties:
            instrument_id: { type: integer, format: int64 }
            ltp: { type: string, description: "Decimal string; absent until a tick is seen" }
            future_id: { type: integer, format: int64, description: "Same-expiry future, when listed" }
            fut_ltp: { type: string }
        expiry: { type: string, format: date }
        lot_size: { type: integer }
        analytics: { type: string, enum: [ok, unavailable] }
        model: { type: string, enum: [black76, bsm] }
        forward: { type: number, format: double, description: "Forward (Black-76) or dividend-adjusted spot (BSM), rupees" }
        forward_source: { type: string, enum: [future, synthetic_mid, synthetic_ltp, spot] }
        rate: { type: number, format: double }
        rate_as_of: { type: string, format: date, description: "When the configured risk-free rate took effect" }
        t_years: { type: number, format: double }
        atm_strike: { type: string }
        pcr: { type: number, format: double, description: "Put OI / call OI over every strike of the expiry with OI" }
        max_pain: { type: string }
        oi_strikes: { type: integer, description: "Strikes with OI behind pcr and max_pain" }
        contract_ids:
          type: array
          description: Every contract of the expiry (subscribe them so PCR and max pain see the whole chain)
          items: { type: integer, format: int64 }
        as_of: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: "#/components/schemas/OptionChainRow" }
    OptionChainRow:
      type: object
      required: [strike]
      properties:
        strike: { type: string }
        ce: { $ref: "#/components/schemas/OptionSide" }
        pe: { $ref: "#/components/schemas/OptionSide" }
    OptionSide:
      type: object
      description: |
        One contract. Market fields are absent until a tick is seen; analytics are absent where undefined
        (no forward, price below intrinsic − 1 tick, …). iv is a decimal (0.142 = 14.2 %); Greeks are per
        unit with respect to the model's underlying: theta in ₹ per calendar day, vega in ₹ per vol point.
      required: [instrument_id, tradingsymbol]
      properties:
        instrument_id: { type: integer, format: int64 }
        tradingsymbol: { type: string }
        ltp: { type: string }
        prev_close: { type: string }
        bid: { type: string }
        ask: { type: string }
        volume: { type: integer, format: int64 }
        oi: { type: integer, format: int64 }
        oi_chg: { type: integer, format: int64 }
        iv: { type: number, format: double }
        iv_source: { type: string, enum: [mid, ltp], description: "Price the IV was solved from" }
        delta: { type: number, format: double }
        gamma: { type: number, format: double }
        theta: { type: number, format: double }
        vega: { type: number, format: double }
    BrokerLoginUrl:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: "Stable machine code, e.g. R-LOSS-DAILY" }
        locked_until: { type: string, format: date-time, description: "Set with AUTH_LOCKED" }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/ProblemReason" }
    ProblemReason:
      type: object
      required: [code]
      properties:
        code: { type: string }
        limit: { type: string }
        current: { type: string }
