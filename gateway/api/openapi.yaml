openapi: 3.0.3
info:
  title: Vyuha Gateway API
  version: 0.0.1
  description: |
    REST contract for the Vyuha gateway (source of truth for codegen; see docs/API.md).
    Endpoints are added contract-first by the task that implements them.
    Money/prices are decimal strings; timestamps are RFC 3339 UTC; errors are RFC 9457 problem+json.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: brokers
paths:
  /health:
    get:
      operationId: getHealth
      summary: Gateway health with dependency checks
      description: Unauthenticated. 200 when every check passes, 503 when any dependency is unavailable.
      tags: [system]
      security: []
      responses:
        "200":
          description: All checks pass
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: At least one dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/login:
    post:
      operationId: login
      summary: Password step; returns an mfa_token for the TOTP step
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Password accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423": { $ref: "#/components/responses/Locked" }
  /auth/mfa:
    post:
      operationId: verifyMfa
      summary: TOTP step for an enrolled user; starts a session
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaRequest" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423": { $ref: "#/components/responses/Locked" }
  /auth/mfa/enroll:
    post:
      operationId: beginMfaEnroll
      summary: First login only; generates a TOTP secret to scan
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaTokenRequest" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Secret generated (not active until confirmed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423": { $ref: "#/components/responses/Locked" }
  /auth/mfa/enroll/confirm:
    post:
      operationId: confirmMfaEnroll
      summary: Confirms enrollment with a first code and starts a session
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaRequest" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423": { $ref: "#/components/responses/Locked" }
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotates the refresh cookie and returns a new access token
      description: Presenting an already-rotated refresh token revokes the whole session (AUTH_REFRESH_REUSED).
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401":
          description: Missing, invalid, expired or reused refresh token; the cookie is cleared
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/logout:
    post:
      operationId: logout
      summary: Revokes the current session and clears the refresh cookie
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "204":
          description: Logged out
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
  /auth/reauth:
    post:
      operationId: reauth
      summary: Re-checks password + TOTP; returns a reauth_token for the X-Reauth header
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Re-authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423": { $ref: "#/components/responses/Locked" }
  /brokers/{account_id}/login-url:
    get:
      operationId: getBrokerLoginUrl
      summary: Daily broker login URL (Kite Connect login / Upstox OAuth dialog)
      description: |
        Admin, or a trader mapped to the account with can_trade. The URL carries a signed, single-use
        `state` (10 minutes) that the callback checks; the broker's own 2FA happens on its site.
      tags: [brokers]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Login URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerLoginUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The account has no broker login (BROKER_NO_LOGIN, e.g. a sim account)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /brokers/callback/zerodha:
    get:
      operationId: brokerCallbackZerodha
      summary: Kite Connect redirect; exchanges request_token and starts the engine session
      description: |
        Browser redirect from Kite (no bearer token: the signed `state` identifies the user). Always
        redirects to `/terminal?broker_login=ok&account=<id>` or `/terminal?broker_login=error&code=<CODE>`.
      tags: [brokers]
      security: []
      parameters:
        - { name: request_token, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        "302": { $ref: "#/components/responses/BrokerLoginRedirect" }
  /brokers/callback/upstox:
    get:
      operationId: brokerCallbackUpstox
      summary: Upstox OAuth redirect; exchanges the code and starts the engine session
      description: Same contract as the Kite callback.
      tags: [brokers]
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        "302": { $ref: "#/components/responses/BrokerLoginRedirect" }
components:
  parameters:
    RefreshCookie:
      name: vyuha_rt
      in: cookie
      required: false
      schema: { type: string }
  headers:
    SetCookie:
      description: "vyuha_rt refresh cookie (HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth)"
      schema: { type: string }
  responses:
    BrokerLoginRedirect:
      description: Back to the terminal with the outcome (never carries tokens)
      headers:
        Location:
          schema: { type: string }
    Forbidden:
      description: Not allowed for this user or account (FORBIDDEN)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource (NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    SessionStarted:
      description: Session started or refreshed; sets the rotated refresh cookie
      headers:
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SessionResponse" }
    Unauthorized:
      description: Invalid credentials or token (AUTH_INVALID, AUTH_UNAUTHENTICATED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Locked:
      description: Account locked after repeated failures (AUTH_LOCKED, see locked_until)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited (RATE_LIMITED) or too many credential checks in progress (AUTH_BUSY); retry after Retry-After seconds
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Wrong enrollment state (AUTH_MFA_NOT_ENROLLED, AUTH_MFA_ALREADY_ENROLLED, AUTH_MFA_ENROLL_NOT_STARTED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, version, env, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          example: 0.0.1
        env:
          type: string
          enum: [dev, staging, prod]
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Check" }
    Check:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail]
        latency_ms:
          type: integer
          format: int64
        error:
          type: string
          description: Generic reason; never contains hosts, credentials or driver errors.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 512, format: password }
    LoginResponse:
      type: object
      required: [mfa_token, mfa_enrolled]
      properties:
        mfa_token: { type: string, description: "Valid for 5 minutes" }
        mfa_enrolled: { type: boolean }
    MfaTokenRequest:
      type: object
      required: [mfa_token]
      properties:
        mfa_token: { type: string }
    MfaRequest:
      type: object
      required: [mfa_token, totp]
      properties:
        mfa_token: { type: string }
        totp: { type: string, pattern: "^[0-9]{6}$" }
    MfaEnrollResponse:
      type: object
      required: [otpauth_url, qr_png_base64]
      properties:
        otpauth_url: { type: string }
        qr_png_base64: { type: string }
    SessionResponse:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token: { type: string }
        expires_in: { type: integer, description: "Seconds" }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, username, display_name, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role:
          type: string
          enum: [admin, risk_manager, trader, analyst]
    ReauthRequest:
      type: object
      required: [password, totp]
      properties:
        password: { type: string, maxLength: 512, format: password }
        totp: { type: string, pattern: "^[0-9]{6}$" }
    ReauthResponse:
      type: object
      required: [reauth_token, expires_in]
      properties:
        reauth_token: { type: string }
        expires_in: { type: integer, description: "Seconds" }
    BrokerLoginUrl:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: "Stable machine code, e.g. R-LOSS-DAILY" }
        locked_until: { type: string, format: date-time, description: "Set with AUTH_LOCKED" }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/ProblemReason" }
    ProblemReason:
      type: object
      required: [code]
      properties:
        code: { type: string }
        limit: { type: string }
        current: { type: string }
