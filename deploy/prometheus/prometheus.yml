global:
  scrape_interval: 5s
scrape_configs:
  - job_name: engine
    static_configs: [{ targets: ["host.docker.internal:9464"] }]
  - job_name: gateway
    static_configs: [{ targets: ["host.docker.internal:9465"] }]
  - job_name: quant
    static_configs: [{ targets: ["host.docker.internal:9466"] }]
  - job_name: intel
    static_configs: [{ targets: ["host.docker.internal:9467"] }]
  - job_name: nats
    metrics_path: /varz
    static_configs: [{ targets: ["nats:8222"] }]
