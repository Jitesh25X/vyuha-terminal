# CI: one job per service, all through the same `make` targets used locally.
# Toolchains come from scripts/bootstrap.sh (pinned + sha256) so CI and dev machines match.
# Branch protection requires the single `ci-ok` check, so jobs can be added or renamed freely.
# The intel/ job is added by the task that scaffolds it (M6.x).
#
# Cost controls: `changes` (scripts/ci-changes.sh) runs only the services a change touches; the engine
# runs its debug preset here, while ASan/TSan and parser fuzzing run in nightly.yml; superseded PR runs
# are cancelled; caches are keyed by lockfiles, so PRs hit main's caches and don't save new ones.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VYUHA_TOOLS_DIR: /home/runner/.local/share/vyuha-tools

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.f.outputs.engine }}
      gateway: ${{ steps.f.outputs.gateway }}
      quant: ${{ steps.f.outputs.quant }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # PRs: the PR's changes (base → merge commit). Pushes: since the previous push. Manual runs: all.
      - id: f
        run: scripts/ci-changes.sh "${{ github.event_name != 'workflow_dispatch' && (github.event.pull_request.base.sha || github.event.before) || '' }}" "${{ github.sha }}"

  hygiene:
    name: invariants + secrets scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: scripts/check-invariants.sh
      - name: gitleaks (pinned + sha256)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tmp/gl.tgz" | sha256sum -c -
          tar -C "$tmp" -xzf "$tmp/gl.tgz" gitleaks
          "$tmp/gitleaks" git --redact --no-banner --verbose .

  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    uses: ./.github/workflows/engine.yml
    with:
      presets: '["debug"]'

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOFLAGS: -race
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VYUHA_TOOLS_DIR }}
          key: tools-go-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('gateway/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: |
          scripts/bootstrap.sh proto
          scripts/bootstrap.sh go
          echo "$VYUHA_TOOLS_DIR/bin" >> "$GITHUB_PATH"
      - run: make up PROFILES="core md" # postgres + nats + clickhouse (pinned digests) for integration tests
      - run: make test-gateway
      - run: make lint-gateway
      - name: generated code is up to date (oapi-codegen, sqlc)
        run: |
          make gen
          git diff --exit-code -- gateway

  quant:
    needs: changes
    if: needs.changes.outputs.quant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VYUHA_TOOLS_DIR }}
          key: tools-py-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('quant/uv.lock') }}
      - run: |
          scripts/bootstrap.sh py
          echo "$VYUHA_TOOLS_DIR/bin" >> "$GITHUB_PATH"
      - working-directory: quant
        run: uv sync --locked
      - run: make up # instrument sync / ban list / holiday integration tests need Postgres
      - run: make lint-quant test-quant

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VYUHA_TOOLS_DIR }}
          key: tools-web-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('gateway/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      # The e2e builds the gateway, so this job needs Go and buf as well as Node.
      - run: |
          scripts/bootstrap.sh proto
          scripts/bootstrap.sh go
          scripts/bootstrap.sh web
          echo "$VYUHA_TOOLS_DIR/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - working-directory: web
        run: |
          pnpm config set store-dir ~/.local/share/pnpm/store
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps --only-shell chromium
      - run: make lint-web test-web
      - working-directory: web
        run: pnpm build
      - run: make up
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: web/test-results/
          retention-days: 7

  # The one required status check on main. Jobs skipped by the path filter count as passing; a failed
  # or cancelled job (including `changes` itself) fails it.
  ci-ok:
    if: always()
    needs: [changes, hygiene, engine, gateway, quant, web]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          [ "${{ needs.changes.result }}" = success ]
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false ]
