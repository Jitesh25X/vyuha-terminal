[project]
name = "vyuha-quant"
version = "0.0.1"
description = "Vyuha quant service: instrument master, data, risk analytics, backtest"
requires-python = "==3.13.*"
dependencies = [
  "polars",
  "httpx",
  "pydantic",
  "asyncpg",
  "exchange-calendars",
  "numpy>=2.5.4",
  "scipy>=1.18.1",
  "fastapi>=0.156.4",
  "uvicorn>=0.54.0",
  "aiolimiter>=1.3.0",
]

[project.scripts]
vyuha-quant = "vyuha_quant.cli:main"

[dependency-groups]
dev = ["pytest", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vyuha_quant"]

[tool.uv]
# Supply-chain guard: resolve only releases at least 7 days old (bump when updating the lock).
exclude-newer = "2026-10-21T00:00:00Z"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DTZ", "PT"]
ignore = ["S101", "E501"] # asserts are fine; line length is the formatter's job
# Pricing docstrings state formulas in maths notation (quant/CLAUDE.md): minus sign, sigma, times.
allowed-confusables = ["−", "σ", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
# Generated by `make proto` (gitignored); type-checked once a task adds the protobuf runtime.
exclude = ["src/vyuha_proto/"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*", "asyncpg", "asyncpg.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
