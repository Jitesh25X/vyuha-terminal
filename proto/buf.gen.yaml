version: v2
# Generate with: cd proto && buf generate
plugins:
  # Go (gateway)
  - remote: buf.build/protocolbuffers/go
    out: ../gateway/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../gateway/gen
    opt: paths=source_relative
  # Python (quant, intel)
  - remote: buf.build/protocolbuffers/python
    out: ../quant/src/vyuha_proto
  - remote: buf.build/protocolbuffers/pyi
    out: ../quant/src/vyuha_proto
  - remote: buf.build/grpc/python
    out: ../quant/src/vyuha_proto
  # TypeScript (web)
  - remote: buf.build/bufbuild/es
    out: ../web/src/gen
    opt: target=ts
# C++ (engine) is generated by CMake via protobuf_generate()/grpc in engine/CMakeLists.txt
# so it always matches the vcpkg-pinned protobuf/gRPC versions.
