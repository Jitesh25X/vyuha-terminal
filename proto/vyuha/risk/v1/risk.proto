syntax = "proto3";

package vyuha.risk.v1;

option go_package = "github.com/jiteshraj/vyuha/gateway/gen/vyuha/risk/v1;riskv1";

enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_DESK = 1;
  SCOPE_ACCOUNT = 2;
  SCOPE_TRADER = 3;
  SCOPE_STRATEGY = 4;
  SCOPE_INSTRUMENT = 5;
}

enum KillAction {
  KILL_ACTION_UNSPECIFIED = 0;
  KILL_ACTION_BLOCK = 1;
  KILL_ACTION_CANCEL = 2;
  KILL_ACTION_FLATTEN = 3;
}

message Limit {
  Scope scope = 1;
  string scope_id = 2;
  string key = 3;
  string value = 4;   // decimal string
  bool hard = 5;
}

message LimitSet {
  uint64 version = 1;
  repeated Limit limits = 2;
}

message KillSwitchState {
  Scope scope = 1;
  string scope_id = 2;
  bool active = 3;
  repeated KillAction actions = 4;
  string trigger = 5;   // "manual" | "auto:<rule>"
  string reason = 6;
  string set_by = 7;
  int64 ts_ns = 8;
}

message LimitUtilisation {
  string key = 1;
  string limit = 2;
  string current = 3;
  double pct = 4;
}

message RiskSummary {
  Scope scope = 1;
  string scope_id = 2;
  int64 ts_ns = 3;
  double delta_inr = 4;        // rupee delta (∂P/∂S × S)
  double beta_delta_inr = 5;   // NIFTY-beta-adjusted
  double gamma_inr = 6;        // per 1% move
  double vega_inr = 7;         // per 1 vol point
  double theta_inr = 8;        // per calendar day
  double gross_exposure_inr = 9;
  double net_exposure_inr = 10;
  double var99_1d_inr = 11;
  double var95_1d_inr = 12;
  double realized_inr = 13;
  double unrealized_inr = 14;
  double costs_inr = 15;
  map<string, double> sector_exposure_inr = 16;
  repeated LimitUtilisation utilisation = 17;
  bool stale = 18;
}
