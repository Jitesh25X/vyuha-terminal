version: v2
# TypeScript (web). Run via `make proto` once web/package.json exists (M0.9).
# Pin the plugin version to match @bufbuild/protobuf in web/pnpm-lock.yaml when the web app is scaffolded.
plugins:
  - remote: buf.build/bufbuild/es
    out: ../web/src/gen
    opt: target=ts
# C++ (engine) is generated by CMake via protobuf_generate()/grpc in engine/CMakeLists.txt
# so it always matches the vcpkg-pinned protobuf/gRPC versions.
