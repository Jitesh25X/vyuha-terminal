version: v2
# TypeScript (web). `make proto` runs this once web depends on @bufbuild/protobuf (the task that first
# decodes WS frames adds it); pin the plugin version below to match web/pnpm-lock.yaml then.
plugins:
  - remote: buf.build/bufbuild/es
    out: ../web/src/gen
    opt: target=ts
# C++ (engine) is generated by CMake via protobuf_generate()/grpc in engine/CMakeLists.txt
# so it always matches the vcpkg-pinned protobuf/gRPC versions.
