version: v2
# TypeScript (web). `make proto` runs this once web depends on @bufbuild/protobuf (M1.9).
# Plugin version matches @bufbuild/protobuf in web/package.json.
plugins:
  - remote: buf.build/bufbuild/es:v2.16.0
    out: ../web/src/gen
    opt: target=ts
# C++ (engine) is generated by CMake via protobuf_generate()/grpc in engine/CMakeLists.txt
# so it always matches the vcpkg-pinned protobuf/gRPC versions.
