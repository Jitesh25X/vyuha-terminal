version: v2
# Python (quant, intel). `make proto` runs this once quant/uv.lock contains the protobuf runtime
# (the first task that consumes NATS/gRPC messages adds it); pin the plugin versions below to match then.
plugins:
  - remote: buf.build/protocolbuffers/python
    out: ../quant/src/vyuha_proto
  - remote: buf.build/protocolbuffers/pyi
    out: ../quant/src/vyuha_proto
  - remote: buf.build/grpc/python
    out: ../quant/src/vyuha_proto
