version: v2
# Go (gateway). Run via `make proto` once gateway/go.mod exists (M0.6).
# Plugin versions match gateway/go.mod: google.golang.org/protobuf v1.36.12, protoc-gen-go-grpc v1.6.2 (grpc runtime ≥ 1.64).
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../gateway/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: ../gateway/gen
    opt: paths=source_relative
